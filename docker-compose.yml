# Cazador — stack de deteccion / publicacion / negociacion.
#
# Todo escucha SOLO en 127.0.0.1. Lo unico que sale a internet es el path
# /cazador del Funnel de Tailscale, que apunta a api:8010.
#
# Puertos elegidos para no chocar con lo que ya corre en el servidor:
#   5432 remato-online   5433 thinkpads   -> cazador usa 5434
#   6379 libre pero reservado             -> cazador usa 6380
#   4000/4100/4173/8080/8443/9200 ocupados-> cazador usa 8010

name: cazador

services:
  postgres:
    image: postgres:16-alpine
    container_name: cazador-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cazador
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: cazador
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cazador -d cazador"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cazador-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "100"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: cazador-api
    restart: unless-stopped
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8010"]
    env_file: .env
    environment:
      PG_DSN: postgresql://cazador:${PG_PASSWORD}@postgres:5432/cazador
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://host.docker.internal:11434
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    ports:
      - "127.0.0.1:8010:8010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  # worker y bot van en red de host por una sola razon: Ollama escucha solo en
  # 127.0.0.1 del servidor y cambiar eso pide root y lo dejaria expuesto a la
  # LAN. Con red de host llegan a Ollama, a postgres (127.0.0.1:5434) y a
  # redis (127.0.0.1:6380) sin abrir NADA nuevo: ninguno de los dos escucha.
  worker:
    build: .
    container_name: cazador-worker
    restart: unless-stopped
    network_mode: host
    command: ["python", "-m", "app.worker.main"]
    env_file: .env
    environment:
      PG_DSN: postgresql://cazador:${PG_PASSWORD}@127.0.0.1:5434/cazador
      REDIS_URL: redis://127.0.0.1:6380/0
      OLLAMA_URL: http://127.0.0.1:11434
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  # @tu_bot_cazador — te avisa de ofertas y negocia con el vendedor
  bot-cazador:
    build: .
    container_name: cazador-bot-cazador
    restart: unless-stopped
    network_mode: host
    command: ["python", "-m", "app.bot.cazador"]
    env_file: .env
    environment:
      PG_DSN: postgresql://cazador:${PG_PASSWORD}@127.0.0.1:5434/cazador
      REDIS_URL: redis://127.0.0.1:6380/0
      OLLAMA_URL: http://127.0.0.1:11434
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  # @tu_bot_publicador — le mandas fotos y publica en ML y Facebook
  bot-publicador:
    build: .
    container_name: cazador-bot-publicador
    restart: unless-stopped
    network_mode: host
    command: ["python", "-m", "app.bot.publicador"]
    env_file: .env
    environment:
      PG_DSN: postgresql://cazador:${PG_PASSWORD}@127.0.0.1:5434/cazador
      REDIS_URL: redis://127.0.0.1:6380/0
      OLLAMA_URL: http://127.0.0.1:11434
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  # Navegador. No arranca solo: es un servicio que se invoca a demanda.
  #   docker compose --profile scraper build
  #   docker compose --profile scraper run --rm scraper python -m app.jobs.fetch_aduanas
  # El reloj de Facebook. Corre EN PARALELO con `worker`, que hace todo lo de
  # MercadoLibre. Son dos porque los jobs de FB necesitan un Chrome de verdad
  # y esa imagen pesa 4 GB: meterla en el worker liviano haria que cada cambio
  # de codigo reconstruya 4 GB.
  #
  # Antes los jobs de FB estaban en el worker liviano y morian con "falta
  # playwright" en cada ciclo, sin ruido. Parecia que cazaba en los dos lados
  # y cazaba solo en ML.
  worker-fb:
    build:
      context: .
      dockerfile: Dockerfile.vnc
    container_name: cazador-worker-fb
    restart: unless-stopped
    network_mode: host
    entrypoint: ["python"]
    command: ["-m", "app.worker.fb"]
    env_file: .env
    environment:
      PG_DSN: postgresql://cazador:${PG_PASSWORD}@127.0.0.1:5434/cazador
      REDIS_URL: redis://127.0.0.1:6380/0
      OLLAMA_URL: http://127.0.0.1:11434
    shm_size: "1gb"          # Chrome se cae con los 64 MB por defecto
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  # Navegador que TU ves, sin X11 y sin root. Corre una pantalla virtual y la
  # sirve como pagina web en 127.0.0.1:6080. Tu la abres por un tunel SSH:
  #   ssh -L 6080:127.0.0.1:6080 remato
  #   http://127.0.0.1:6080/vnc.html
  # Escucha SOLO en loopback: nadie llega desde fuera del servidor.
  navegador:
    build:
      context: .
      dockerfile: Dockerfile.vnc
    profiles: ["vnc"]
    # Red de host, igual que worker y bots. Sin esto el contenedor esta en la
    # red bridge y su 127.0.0.1 es EL MISMO, no el servidor: postgres (5434),
    # redis (6380) y Ollama (11434) escuchan solo en el loopback del host, asi
    # que no los alcanza. Fallaba con PoolTimeout a los 30 s (28-ago).
    # Con red de host tampoco hace falta publicar el 6080: ya es el del host.
    # Por eso x11vnc y websockify se atan a 127.0.0.1 en bin/arranque-vnc.sh —
    # si no, quedarian abiertos a la LAN y al tailnet.
    network_mode: host
    env_file: .env
    environment:
      PG_DSN: postgresql://cazador:${PG_PASSWORD}@127.0.0.1:5434/cazador
      REDIS_URL: redis://127.0.0.1:6380/0
      OLLAMA_URL: http://127.0.0.1:11434
    shm_size: "1gb"          # Chrome se cae con los 64 MB por defecto
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data

  scraper:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    profiles: ["scraper"]
    network_mode: host
    env_file: .env
    environment:
      PG_DSN: postgresql://cazador:${PG_PASSWORD}@127.0.0.1:5434/cazador
      REDIS_URL: redis://127.0.0.1:6380/0
      OLLAMA_URL: http://127.0.0.1:11434
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data

volumes:
  pgdata:
  redisdata:
